<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script>
(function () {
  'use strict';

  var VOICE_OK = 'speechSynthesis' in window;
  var RECENT_KEY = 'nav_recent_v1';
  var PREF_KEY = 'nav_prefs_v1';
  function loadPrefs() {
    try {
      var p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
      ['tolls', 'highways', 'ferry', 'tracks', 'voice'].forEach(function (k) {
        if (typeof p[k] === 'boolean') state.prefs[k] = p[k];
      });
      if (p.costing === 'auto' || p.costing === 'bicycle' || p.costing === 'pedestrian') state.prefs.costing = p.costing;
    } catch (e) {}
  }
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs)); } catch (e) {}
  }
  var FRANCE = [46.6, 2.4];

  var state = {
    phase: 'home', dest: null, routes: [], sel: 0, route: null,
    traveled: 0, playing: false, following: false, navigating: false, arrived: false,
    speedFactor: 1, lastStep: -1,
    prefs: { costing: 'auto', tolls: false, highways: false, ferry: false, tracks: false, voice: VOICE_OK },
    planTs: null,
    pos: null, posLabel: '', posDenied: false, centered: false, pickMode: 'dest', geoError: 0,
    fix: null, gpsLive: false, gpsWatch: null, ri: 0, lastReroute: 0, offCount: 0,
    recents: []
  };

  var map = L.map('map', {
    center: FRANCE, zoom: 5, zoomControl: false, attributionControl: false,
    zoomSnap: .25, zoomDelta: .5, wheelPxPerZoomLevel: 90,
    preferCanvas: true, zoomAnimation: false, fadeAnimation: false, markerZoomAnimation: false,
    rotate: true, touchRotate: true, rotateControl: false, shiftKeyRotate: true
  });
  L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);
  L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 110 }).addTo(map);

  var TILES = [
    { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      attr: 'Fond de carte &copy; Esri, HERE, Garmin, &copy; OpenStreetMap' },
    { url: 'https://a.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', attr: '&copy; OpenStreetMap France' },
    { url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr: '&copy; OpenStreetMap' }
  ];
  var tiles = null, tAt = -1, tErr = 0;
  function useTiles(i) {
    if (i >= TILES.length) return;
    if (tiles) map.removeLayer(tiles);
    tAt = i; tErr = 0;
    tiles = L.tileLayer(TILES[i].url, {
      maxZoom: 19, crossOrigin: true, detectRetina: true, attribution: TILES[i].attr,
      updateWhenIdle: false, updateWhenZooming: false, keepBuffer: 6
    }).addTo(map);
    tiles.on('tileerror', function () { if (++tErr >= 2) useTiles(tAt + 1); });
  }
  useTiles(0);
  map.on('rotate', updateNeedle);
  map.on('rotateend', updateNeedle);

  try { window.__map = map; } catch (e) {}

  var me = L.marker(FRANCE, {
    icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }),
    interactive: false, keyboard: false
  }).addTo(map);
  me.setOpacity(0);

  var destMarker = null, carMarker = null, jamMarker = null;
  var altLayers = [], routeLayer = null, casingLayer = null, arrowLayers = [], jamLayer = null, jamCasing = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function destIcon(label) {
    return L.divIcon({
      className: '', iconSize: [36, 48], iconAnchor: [18, 46],
      html: '<div class="pin-dest"><span class="lbl">' + escapeHtml(label) + '</span>' +
        '<svg width="36" height="48" viewBox="0 0 38 50" fill="none"><path d="M19 48C19 48 36 30.5 36 18.8C36 8.5 28.4 0 19 0C9.6 0 2 8.5 2 18.8C2 30.5 19 48 19 48Z" fill="#e5484d" stroke="#fff" stroke-width="3"/><circle cx="19" cy="18.5" r="6" fill="#fff"/></svg></div>'
    });
  }

  function km(m) { return (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km'; }
  function mins(s) {
    var m = Math.max(1, Math.round(s / 60));
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60;
    return h + ' h' + (r ? ' ' + (r < 10 ? '0' + r : r) : '');
  }
  function clock(ts) { return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function dayLabel(ts) {
    var d = new Date(ts), now = new Date();
    var same = d.toDateString() === now.toDateString();
    var tm = new Date(now.getTime() + 86400000).toDateString() === d.toDateString();
    return (same ? 'aujourd’hui' : tm ? 'demain' : d.toLocaleDateString('fr-FR', { weekday: 'long' })) + ' à ' + clock(ts);
  }

  function decodeShape(str) {
    var coords = [], lat = 0, lon = 0, i = 0;
    while (i < str.length) {
      for (var which = 0; which < 2; which++) {
        var shift = 0, result = 0, b;
        do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        var d = (result & 1) ? ~(result >> 1) : (result >> 1);
        if (which === 0) lat += d; else lon += d;
      }
      coords.push([lat / 1e6, lon / 1e6]);
    }
    return coords;
  }
  function haversine(a, b) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(a, b) {
    var rad = Math.PI / 180;
    var y = Math.sin((b[1] - a[1]) * rad) * Math.cos(b[0] * rad);
    var x = Math.cos(a[0] * rad) * Math.sin(b[0] * rad) - Math.sin(a[0] * rad) * Math.cos(b[0] * rad) * Math.cos((b[1] - a[1]) * rad);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  /* ---------- préférences de trajet ---------- */
  function prefsExtra(override) {
    var p = state.prefs;
    var o = { costing: p.costing };
    if (p.costing === 'auto') {
      var a = {};
      if (p.tolls) a.use_tolls = 0;
      if (p.highways) a.use_highways = 0;
      if (p.ferry) a.use_ferry = 0;
      if (p.tracks) a.use_tracks = 0;
      if (Object.keys(a).length) o.costing_options = { auto: a };
    }
    if (override) for (var k in override) o[k] = override[k];
    return o;
  }
  function prefsLabel() {
    var p = state.prefs;
    var v = p.costing === 'bicycle' ? 'Vélo' : p.costing === 'pedestrian' ? 'À pied' : 'Voiture';
    var av = [];
    if (p.costing === 'auto') {
      if (p.tolls) av.push('sans péage');
      if (p.highways) av.push('sans autoroute');
      if (p.ferry) av.push('sans bac');
      if (p.tracks) av.push('sans chemin');
    }
    return v + (av.length ? ' · ' + av.join(', ') : '');
  }

  function valhalla(from, to, extra) {
    var body = {
      locations: [{ lat: from.lat, lon: from.lon }, { lat: to.lat, lon: to.lon }],
      costing: 'auto',
      units: 'kilometers',
      directions_options: { language: 'fr-FR', units: 'kilometers' }
    };
    if (extra) for (var k in extra) body[k] = extra[k];
    return fetch('https://valhalla1.openstreetmap.de/route', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('route ' + r.status);
      return r.json();
    }).then(function (d) {
      var trip = d.trip;
      if (!trip) throw new Error('pas d’itinéraire');
      var leg = trip.legs[0];
      var pts = decodeShape(leg.shape);
      var cum = [0];
      for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + haversine(pts[i - 1], pts[i]));
      var steps = (leg.maneuvers || []).map(function (m) {
        return {
          text: m.instruction || '',
          at: cum[Math.min(m.begin_shape_index || 0, cum.length - 1)] || 0,
          type: m.type,
          street: (m.street_names && m.street_names[0]) || ''
        };
      }).filter(function (s) { return s.text; });
      var totalD = cum[cum.length - 1];
      var main = '', bestD = 0;
      steps.forEach(function (st, i) {
        var seg = (steps[i + 1] ? steps[i + 1].at : totalD) - st.at;
        if (st.street && seg > bestD) { bestD = seg; main = st.street; }
      });
      return { pts: pts, cum: cum, length: trip.summary.length * 1000, time: trip.summary.time, steps: steps, main: main };
    });
  }

  var searchTimer = null, searchSeq = 0;

  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }
  var CITY_TYPES = ['city', 'town', 'village', 'municipality', 'administrative', 'state', 'county', 'region'];

  /* le classement de Nominatim privilégie la proximité : « lyon » sortait
     « Gare de Lyon » à Paris. On remonte les villes et les noms exacts. */
  function rankPlaces(list, term) {
    var q = norm(term);
    return list.map(function (p) {
      var parts = (p.display_name || '').split(',');
      var name = (p.name || parts[0] || '').trim();
      var n = norm(name);
      var score = 0;
      if (n === q) score += 100;
      else if (n.indexOf(q) === 0) score += 60;
      else if (n.indexOf(q) > -1) score += 35;
      if (CITY_TYPES.indexOf(p.type) > -1) score += 55;
      if (p.class === 'place' || p.class === 'boundary') score += 20;
      if (p.type === 'house' || p.type === 'railway' || p.class === 'railway') score += 5;
      if (state.pos) {
        var d = haversine([state.pos.lat, state.pos.lon], [parseFloat(p.lat), parseFloat(p.lon)]);
        score += Math.max(0, 40 - Math.min(40, d / 1000));
      }
      return {
        name: name,
        sub: parts.slice(1, 3).join(',').trim(),
        lat: parseFloat(p.lat),
        lon: parseFloat(p.lon),
        score: score
      };
    }).sort(function (a, b) { return b.score - a.score; }).slice(0, 6);
  }

  function searchPlaces(term) {
    var seq = ++searchSeq;
    var vb = state.pos
      ? [state.pos.lon - .4, state.pos.lat - .3, state.pos.lon + .4, state.pos.lat + .3].join(',')
      : '5.60,43.00,6.30,43.35';
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=10&addressdetails=1&accept-language=fr' +
      '&viewbox=' + vb + '&bounded=0&q=' + encodeURIComponent(term);
    return fetch(url).then(function (r) { return r.json(); }).then(function (list) {
      if (seq !== searchSeq) return null;
      return rankPlaces(list || [], term);
    });
  }

  /* le conteneur est plus grand que l'écran : en rotation, les coins restent couverts */
  var mapEl = document.getElementById('map');
  function sizeMap() {
    var scr = document.querySelector('.screen');
    var side = Math.ceil((scr.clientWidth + scr.clientHeight) / 1.42);
    mapEl.style.width = side + 'px';
    mapEl.style.height = side + 'px';
    if (map.invalidateSize) map.invalidateSize({ pan: false });
  }

  state.capUp = false;
  function updateNeedle() {
    var needle = document.getElementById('compass-needle');
    if (needle) needle.style.transform = 'rotate(' + (-currentBearing()) + 'deg)';
  }
  function setBearing(b, animate) {
    if (typeof map.setBearing !== 'function') return;
    map.setBearing(((b % 360) + 540) % 360 - 180, { animate: animate !== false });
    var needle = document.getElementById('compass-needle');
    if (needle) needle.style.transform = 'rotate(' + (-map.getBearing()) + 'deg)';
  }
  function currentBearing() {
    return typeof map.getBearing === 'function' ? map.getBearing() : 0;
  }

  var sheet = document.getElementById('sheet');
  var sheetBody = document.getElementById('sheet-body');
  var hud = document.getElementById('hud');
  var navBar = document.getElementById('navbar');
  var fabCol = document.getElementById('fabcol');
  var toastEl = document.getElementById('toast');
  var bannerEl = document.getElementById('banner');
  var bannerTxt = document.getElementById('banner-txt');
  var sugg = document.getElementById('sugg');
  var qInput = document.getElementById('q');
  var searchBox = document.getElementById('searchbox');
  var topEl = document.getElementById('top');
  var ovl = document.getElementById('ovl');
  var toastTimer = null, bannerTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2800);
  }
  function banner(msg, ms) {
    bannerTxt.textContent = msg;
    bannerEl.classList.add('on');
    clearTimeout(bannerTimer);
    if (ms) bannerTimer = setTimeout(function () { bannerEl.classList.remove('on'); }, ms);
  }
  function hideBanner() { bannerEl.classList.remove('on'); }

  var sheetMode = 'open';
  function sheetH() { return sheet.offsetHeight || 0; }
  function shownFor(mode) {
    var h = sheetH();
    if (mode === 'hidden') return 0;
    if (mode === 'closed') return 54;
    if (mode === 'peek') return Math.min(152, h);
    return h;
  }
  function applySheet(px, animate) {
    var h = sheetH();
    if (!h) return;
    px = Math.max(0, Math.min(h, px));
    sheet.style.transition = animate === false ? 'none' : '';
    sheet.style.transform = 'translateY(' + Math.round(h - px) + 'px)';
    document.documentElement.style.setProperty('--sheet-h', Math.round(px) + 'px');
    document.documentElement.style.setProperty('--credit', (state.navigating ? 106 : Math.round(px) + 6) + 'px');
    fabCol.style.bottom = (state.navigating ? 86 : Math.round(px) + 14) + 'px';
  }
  function setSheetMode(mode, animate) {
    sheetMode = mode;
    sheet.classList.toggle('compact', mode === 'peek' || mode === 'closed');
    sheet.classList.toggle('closed-lede', mode === 'closed');
    applySheet(shownFor(mode), animate !== false);
  }
  function setSheetHeight() {
    applySheet(shownFor(sheetMode), false);
    if (state.phase === 'routes') setTimeout(ensurePinVisible, 60);
  }
  window.addEventListener('resize', function () { sizeMap(); setSheetHeight(); });

  var ICONS = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>',
    work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>',
    recent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M9 5l7 7-7 7"/></svg>',
    sliders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg>'
  };

  /* ---------- position de la personne ---------- */
  function loadRecents() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; }
  }
  function pushRecent(d) {
    var list = loadRecents().filter(function (x) {
      return Math.abs(x.lat - d.lat) > 1e-5 || Math.abs(x.lon - d.lon) > 1e-5;
    });
    list.unshift({ name: d.name, sub: d.sub || '', lat: d.lat, lon: d.lon });
    state.recents = list.slice(0, 5);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(state.recents)); } catch (e) {}
  }

  function reverseGeocode() {
    if (!state.pos) return;
    var u = 'https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=fr' +
      '&lat=' + state.pos.lat + '&lon=' + state.pos.lon;
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      var a = d.address || {};
      var road = a.road || a.pedestrian || a.square || a.neighbourhood || a.suburb || '';
      var city = a.city || a.town || a.village || a.municipality || a.county || '';
      state.posLabel = [road, city].filter(Boolean).join(', ') ||
        (d.display_name || '').split(',').slice(0, 2).join(',').trim();
      if (state.phase === 'home') renderHome();
    }).catch(function () {
      state.posLabel = 'ma position';
    });
  }

  function onFix(p, approx) {
    var city = (p.coords && p.coords.city) || '';
    state.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), approx: !!approx };
    state.fix = { lat: state.pos.lat, lon: state.pos.lon, ts: Date.now() };
    state.gpsLive = !approx;            /* une position réseau ne pilote pas le guidage */
    me.setLatLng([state.pos.lat, state.pos.lon]);
    me.setOpacity(1);

    if (approx) {
      state.posLabel = (city ? city + ' ' : '') + '· position approximative';
    } else if (!state.posLabel || state.posLabel.indexOf('approximative') > -1) {
      state.posLabel = '';
      reverseGeocode();
    }

    if (!state.centered) {
      state.centered = true;
      map.setView([state.pos.lat, state.pos.lon], approx ? 12 : 15, { animate: false });
      if (state.phase === 'home') renderHome();
    }
    if (state.navigating && !approx) snapToRoute();
  }

  function geoMessage() {
    if (location.protocol === 'file:') {
      return 'Page ouverte depuis un fichier : le navigateur bloque la localisation. Utilise l’adresse https:// du site.';
    }
    if (state.geoError === 1) {
      return 'Position refusée. Cadenas à gauche de l’adresse → Position → Autoriser, puis recharge.';
    }
    if (state.geoError === 2) {
      return 'La localisation de l’appareil ne répond pas (Windows : Confidentialité → Localisation).';
    }
    if (state.geoError === 3) return 'La position n’a pas répondu à temps.';
    return 'Position introuvable.';
  }

  function ipLocate() {
    state.posLabel = 'position estimée par le réseau…';
    var providers = [
      { url: 'https://ipapi.co/json/', pick: function (d) {
          return d && d.latitude ? { lat: d.latitude, lon: d.longitude, city: d.city } : null; } },
      { url: 'https://ipwho.is/', pick: function (d) {
          return d && d.success !== false && d.latitude ? { lat: d.latitude, lon: d.longitude, city: d.city } : null; } },
      { url: 'https://ipinfo.io/json', pick: function (d) {
          if (!d || !d.loc) return null;
          var p = d.loc.split(',');
          return { lat: parseFloat(p[0]), lon: parseFloat(p[1]), city: d.city }; } }
    ];
    var i = 0;
    function next() {
      if (i >= providers.length) {
        state.posDenied = true;
        renderHome();
        banner('Position introuvable. Indique ton point de départ à la main.', 9000);
        return;
      }
      var prov = providers[i++];
      fetch(prov.url).then(function (r) { return r.json(); }).then(function (d) {
        var pos = prov.pick(d);
        if (!pos || isNaN(pos.lat)) throw new Error('vide');
        onFix({ coords: { latitude: pos.lat, longitude: pos.lon, accuracy: 5000, city: pos.city || '' } }, true);
        banner('Position approximative : ' + (pos.city || 'ville inconnue') + '. Autorise la localisation pour être précis.', 7000);
      }).catch(next);
    }
    next();
  }

  function locate(step) {
    step = step || 1;
    if (!navigator.geolocation) { state.geoError = 2; ipLocate(); return; }
    var opts = step === 1
      ? { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      : { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 };
    navigator.geolocation.getCurrentPosition(function (p) { onFix(p); }, function (err) {
      state.geoError = (err && err.code) || 2;
      if (step === 1) { locate(2); return; }
      ipLocate();
    }, opts);
  }

  function startWatch() {
    if (!navigator.geolocation || state.gpsWatch !== null) return;
    state.gpsWatch = navigator.geolocation.watchPosition(onFix, function () {}, {
      enableHighAccuracy: true, timeout: 20000, maximumAge: 3000
    });
  }
  function stopWatch() {
    if (state.gpsWatch !== null) {
      navigator.geolocation.clearWatch(state.gpsWatch);
      state.gpsWatch = null;
    }
  }

  /* le point GPS est ramené sur le tracé : on en déduit l'avancement réel */
  function snapToRoute() {
    var r = state.route;
    if (!r || !state.fix) return;
    var here = [state.fix.lat, state.fix.lon];
    var from = Math.max(0, state.ri - 150);
    var to = Math.min(r.pts.length - 1, state.ri + 150);
    var best = { d: Infinity, i: state.ri };
    for (var i = from; i <= to; i++) {
      var dd = haversine(r.pts[i], here);
      if (dd < best.d) best = { d: dd, i: i };
    }
    state.ri = best.i;

    /* seuil adapté à la précision du téléphone, et deux écarts de suite avant
       de recalculer : sinon le bruit GPS relance un itinéraire en boucle */
    var thr = Math.max(60, (state.pos && state.pos.acc ? state.pos.acc : 25) * 2);
    if (best.d > thr) {
      state.offCount = (state.offCount || 0) + 1;
      if (state.offCount >= 2 && Date.now() - state.lastReroute > 15000) {
        state.lastReroute = Date.now();
        state.offCount = 0;
        reroute('gps');
      }
      return;
    }
    state.offCount = 0;
    state.traveled = r.cum[best.i];
  }

  function startPickFrom() {
    state.pickMode = 'from';
    qInput.value = '';
    qInput.placeholder = 'D’où partez-vous ?';
    searchBox.classList.add('picking');
    qInput.focus();
    hideSuggestions();
    toast('Tape une adresse de départ');
  }
  function setDeparture(p) {
    state.pos = { lat: p.lat, lon: p.lon, acc: 0, approx: false, manual: true };
    state.fix = { lat: p.lat, lon: p.lon, ts: Date.now() };
    state.gpsLive = false;
    state.posLabel = [p.name, p.sub].filter(Boolean).join(', ');
    state.centered = true;
    state.pickMode = 'dest';
    qInput.value = '';
    qInput.placeholder = 'Où va-t-on ?';
    searchBox.classList.remove('filled');
    searchBox.classList.remove('picking');
    me.setLatLng([p.lat, p.lon]);
    me.setOpacity(1);
    map.setView([p.lat, p.lon], 15, { animate: false });
    renderHome();
    toast('Départ : ' + p.name);
  }

  /* ---------- fiche ---------- */
  function renderHome() {
    state.phase = 'home';
    var h = '<h2>Où va-t-on ?</h2>' +
      '<p class="sub">' + (state.pos ? 'Départ : ' + escapeHtml((state.posLabel || 'ma position').replace(' · position approximative', ' (approx.)'))
        : state.posDenied ? 'Position non autorisée' : 'Recherche de ta position…') + '</p>' +
      '<button class="chipbtn" data-opts="1">' + ICONS.sliders + escapeHtml(prefsLabel()) + '</button>';

    if (!state.pos) {
      h += '<button class="go" id="pick-from" style="margin-top:12px">Indiquer mon point de départ</button>' +
        '<button class="ghost" id="locate-btn">Réessayer ma position</button>' +
        '<p class="note1">' + escapeHtml(geoMessage()) + '</p>';
    } else if (state.pos.approx) {
      h += '<button class="ghost" id="pick-from" style="margin-top:10px">Préciser mon point de départ</button>';
    }

    if (state.recents.length) {
      h += '<p class="sec-title" style="margin-top:14px">Destinations récentes</p><div class="favs">';
      state.recents.forEach(function (f, i) {
        var dist = state.pos ? ' · à ' + km(haversine([state.pos.lat, state.pos.lon], [f.lat, f.lon])) : '';
        h += '<div class="fav"><button class="fav-main" data-fav="' + i + '"><span class="ico">' + ICONS.recent + '</span>' +
          '<span><span class="t">' + escapeHtml(f.name) + '</span>' +
          '<span class="s">' + escapeHtml(f.sub || '') + dist + '</span></span></button>' +
          '<button class="fav-del" data-del="' + i + '" aria-label="Retirer ' + escapeHtml(f.name) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:13px;height:13px"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
      });
      h += '</div><button class="linkbtn" id="clear-recents">Effacer l’historique</button>';
    } else if (state.pos) {
      h += '<p class="note1">Cherche une adresse dans la barre du haut : elle apparaîtra ensuite ici.</p>';
    }

    sheetBody.innerHTML = h;
    setSheetMode('open', false);
    var lb = document.getElementById('locate-btn');
    if (lb) lb.addEventListener('click', function () { state.posDenied = false; locate(); });
    var pf = document.getElementById('pick-from');
    if (pf) pf.addEventListener('click', startPickFrom);
    var cr = document.getElementById('clear-recents');
    if (cr) cr.addEventListener('click', function () {
      state.recents = [];
      try { localStorage.removeItem(RECENT_KEY); } catch (e) {}
      renderHome();
      toast('Historique effacé');
    });
    Array.prototype.forEach.call(sheetBody.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        state.recents.splice(Number(b.dataset.del), 1);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(state.recents)); } catch (err) {}
        renderHome();
      });
    });
    setSheetHeight();
  }

  function renderLoading(dest) {
    sheetBody.innerHTML = '<div class="loading"><span class="spin"></span><span>Calcul de l’itinéraire vers ' + escapeHtml(dest.name) + '…</span></div>';
    setSheetHeight();
  }
  function renderError(msg) {
    sheetBody.innerHTML = '<h2>Pas d’itinéraire</h2><p class="sub">' + escapeHtml(msg) + '</p><button class="ghost" id="retry">Réessayer</button>';
    setSheetHeight();
    var r = document.getElementById('retry');
    if (r) r.addEventListener('click', function () { if (state.dest) startRoutes(state.dest); else renderHome(); });
  }

  function renderRoutes() {
    state.phase = 'routes';
    var best = state.routes.reduce(function (m, r) { return r.time < m.time ? r : m; }, state.routes[0]);
    var base = state.planTs || Date.now();
    var h = '<h2>' + escapeHtml(state.dest.name) + '</h2><p class="sub">' + escapeHtml(state.dest.sub || '') + '</p>' +
      '<button class="chipbtn" data-opts="1">' + ICONS.sliders + escapeHtml(prefsLabel()) + '</button>';
    if (state.planTs) h += '<br><span class="planline">Départ prévu ' + dayLabel(state.planTs) + '</span>';

    var cur = state.routes[state.sel] || state.routes[0];
    h += '<div class="sum"><span><span class="s-dur">' + mins(cur.time) + '</span>' +
      '<span class="s-meta">' + km(cur.length) + ' · arrivée ' + clock(base + cur.time * 1000) + '</span></span>' +
      '<button class="go" id="start2" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>Démarrer</button></div>';

    h += '<div class="details"><div class="rlist">';
    state.routes.forEach(function (r, i) {
      var isBest = r === best;
      h += '<button class="rcard' + (i === state.sel ? ' sel' : '') + '" data-route="' + i + '">' +
        '<span><span class="line"><span class="dur' + (isBest ? ' best' : '') + '">' + mins(r.time) + '</span>' +
        '<span class="meta">' + km(r.length) + (r.main ? ' · via ' + escapeHtml(r.main) : '') + '</span></span>' +
        '<span class="tag' + (isBest ? ' best' : '') + '">' + escapeHtml(r.label) + '</span></span>' +
        '<span class="eta">arrivée<b>' + clock(base + r.time * 1000) + '</b></span></button>';
    });
    h += '</div>';
    if (state.routes.length === 1 && state.prefs.costing === 'auto') {
      h += '<p class="note1">Une seule route pertinente sur ce trajet : les variantes passent par les mêmes rues. Sur un trajet plus long, plusieurs propositions apparaissent.</p>';
    }
    h += '<button class="go" id="start"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>Démarrer</button></div>';
    sheetBody.innerHTML = h;
    Array.prototype.forEach.call(sheetBody.querySelectorAll('[data-route]'), function (b) {
      b.addEventListener('click', function () { selectRoute(Number(b.dataset.route)); });
    });
    document.getElementById('start').addEventListener('click', startNav);
    var s2 = document.getElementById('start2');
    if (s2) s2.addEventListener('click', startNav);
    setSheetHeight();
  }

  function drawRoutes() {
    altLayers.forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
    altLayers = [];
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (casingLayer) { map.removeLayer(casingLayer); casingLayer = null; }
    if (!state.routes.length) return;
    state.routes.forEach(function (r, i) {
      if (i === state.sel) return;
      altLayers.push(L.polyline(r.pts, { color: '#98a2b3', weight: 6, opacity: .85, lineCap: 'round', lineJoin: 'round' }).addTo(map));
    });
    var sel = state.routes[state.sel];
    casingLayer = L.polyline(sel.pts, { color: '#ffffff', weight: 13, opacity: .95, lineCap: 'round', lineJoin: 'round' }).addTo(map);
    routeLayer = L.polyline(sel.pts, { color: '#2f6bff', weight: 8, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);
    drawArrows(sel);
  }
  function drawArrows(route) {
    arrowLayers.forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
    arrowLayers = [];
    if (!route) return;
    var step = Math.max(420, route.length / 22);
    for (var d = step; d < route.length - 120; d += step) {
      var a = pointAt(route.pts, route.cum, d);
      var b = pointAt(route.pts, route.cum, Math.min(route.length, d + 14));
      var deg = Math.round(bearing(a, b) - 90);
      arrowLayers.push(L.marker(a, {
        icon: L.divIcon({
          className: '', iconSize: [17, 17], iconAnchor: [8, 8],
          html: '<div class="rarrow" style="transform:rotate(' + deg + 'deg)"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>'
        }),
        interactive: false, keyboard: false, zIndexOffset: 320
      }).addTo(map));
    }
  }

  /* le conteneur dépasse de l'écran : la zone utile se calcule en pixels écran */
  function screenRect() {
    var size = map.getSize();
    var scr = document.querySelector('.screen');
    var sw = scr.clientWidth, shh = scr.clientHeight;
    var ox = (size.x - sw) / 2, oy = (size.y - shh) / 2;
    var sheetH = (sheetMode === 'hidden') ? 0 : (sheet.getBoundingClientRect().height || 0);
    var r = {
      left: ox + 34, right: ox + sw - 76,
      top: oy + 108, bottom: oy + shh - sheetH - 26
    };
    if (r.bottom < r.top + 90) r.bottom = r.top + 90;
    return r;
  }

  function fitToRoute() {
    if (!routeLayer) return;
    var sh = sheet.getBoundingClientRect().height || 240;
    var size = map.getSize();
    var scr = document.querySelector('.screen');
    var ox = Math.max(0, (size.x - scr.clientWidth) / 2);
    var oy = Math.max(0, (size.y - scr.clientHeight) / 2);
    /* le conteneur dépasse de l'écran : on compense pour cadrer sur la partie vue */
    map.fitBounds(routeLayer.getBounds(), {
      paddingTopLeft: [ox + 34, oy + 104],
      paddingBottomRight: [ox + 72, oy + sh + 30],
      maxZoom: 16, animate: false
    });
    setTimeout(ensurePinVisible, 220);
  }

  /* garde-fou : après le calcul de la fiche (hauteur définitive), on recadre
     si l'épingle d'arrivée est sortie de la zone visible */
  function ensurePinVisible() {
    if (!state.dest) return;
    var r = screenRect();
    var pin = map.latLngToContainerPoint([state.dest.lat, state.dest.lon]);
    var cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
    var dx = 0, dy = 0;
    if (pin.y > r.bottom || pin.y < r.top) dy = pin.y - cy;
    if (pin.x > r.right || pin.x < r.left) dx = pin.x - cx;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) map.panBy([dx, dy], { animate: false });
  }

  function showSuggestions(list, term) {
    if (!list) return;
    if (!list.length) {
      sugg.innerHTML = '<div class="empty">Aucun lieu trouvé pour « ' + escapeHtml(term) + ' ».</div>';
      sugg.hidden = false; return;
    }
    sugg.innerHTML = list.map(function (p, i) {
      return '<button data-pick="' + i + '"><span class="ico">' + ICONS.recent + '</span>' +
        '<span><span class="t">' + escapeHtml(p.name) + '</span><span class="s">' + escapeHtml(p.sub) + '</span></span></button>';
    }).join('');
    sugg.hidden = false;
    Array.prototype.forEach.call(sugg.querySelectorAll('[data-pick]'), function (b) {
      b.addEventListener('click', function () {
        var p = list[Number(b.dataset.pick)];
        hideSuggestions();
        if (state.pickMode === 'from') { setDeparture(p); return; }
        qInput.value = p.name;
        searchBox.classList.add('filled');
        startRoutes(p);
      });
    });
  }
  function hideSuggestions() { sugg.hidden = true; sugg.innerHTML = ''; }

  qInput.addEventListener('input', function () {
    var term = qInput.value.trim();
    searchBox.classList.toggle('filled', !!term);
    clearTimeout(searchTimer);
    if (term.length < 3) { hideSuggestions(); return; }
    sugg.innerHTML = '<div class="empty">Recherche…</div>';
    sugg.hidden = false;
    searchTimer = setTimeout(function () {
      searchPlaces(term).then(function (list) { showSuggestions(list, term); })
        .catch(function () { sugg.innerHTML = '<div class="empty">Recherche indisponible — vérifie la connexion.</div>'; });
    }, 450);
  });
  qInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      clearTimeout(searchTimer);
      var term = qInput.value.trim();
      if (term.length >= 3) searchPlaces(term).then(function (l) { showSuggestions(l, term); }).catch(function () {});
    }
  });

  document.getElementById('clearq').addEventListener('click', function () {
    qInput.value = ''; searchBox.classList.remove('filled'); hideSuggestions(); qInput.focus();
  });

  sheetBody.addEventListener('click', function (e) {
    if (e.target.closest('[data-opts]')) { openOpts(); return; }
    if (e.target.closest('[data-del]')) return;
    var fav = e.target.closest('[data-fav]');
    if (fav) {
      var f = state.recents[Number(fav.dataset.fav)];
      qInput.value = f.name;
      searchBox.classList.add('filled');
      startRoutes(f);
    }
  });

  /* ---------- itinéraires ---------- */
  function variantsFor() {
    var list = [{ label: 'Ton itinéraire', extra: prefsExtra() }];
    if (state.prefs.costing !== 'auto') return list;
    if (state.prefs.tolls || state.prefs.highways) {
      list.push({ label: 'Par les grands axes', extra: { costing: 'auto' } });
    } else {
      list.push({ label: 'Sans péage', extra: { costing: 'auto', costing_options: { auto: { use_tolls: 0 } } } });
      list.push({ label: 'Sans autoroute', extra: { costing: 'auto', costing_options: { auto: { use_highways: 0 } } } });
    }
    return list;
  }

  function startRoutes(dest) {
    hideSuggestions();
    if (!state.pos) {
      toast('Position inconnue : autorise l’accès à ta position');
      locate();
      return;
    }
    pushRecent(dest);
    state.dest = dest;
    state.sel = 0;
    state.routes = [];
    renderLoading(dest);
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([dest.lat, dest.lon], { icon: destIcon(dest.name), zIndexOffset: 400 }).addTo(map);

    Promise.all(variantsFor().map(function (v) {
      return valhalla(state.pos, dest, v.extra).then(function (r) {
        r.label = v.label; r.extra = v.extra; return r;
      }).catch(function () { return null; });
    })).then(function (list) {
      var ok = list.filter(Boolean);
      if (!ok.length) { renderError('Le calcul a échoué — vérifie la connexion internet.'); return; }
      var keep = [];
      ok.forEach(function (r) {
        var same = keep.some(function (k) { return Math.abs(k.length - r.length) < 60 && Math.abs(k.time - r.time) < 40; });
        if (!same) keep.push(r);
      });
      if (keep.length > 1) {
        var best = keep.reduce(function (m, r) { return r.time < m.time ? r : m; }, keep[0]);
        keep.forEach(function (r) { r.label = r === best ? 'Le plus rapide' : r.label.replace('Ton itinéraire', 'Plus long'); });
      }
      state.routes = keep;
      state.sel = 0;
      drawRoutes();
      renderRoutes();
      fitToRoute();   /* après le rendu : la fiche a sa hauteur définitive */
    });
  }

  function selectRoute(i) {
    state.sel = i;
    drawRoutes();
    renderRoutes();
  }

  /* ---------- guidage ---------- */
  function startNav() {
    var r = state.routes[state.sel];
    if (!r) return;
    state.route = r;
    state.traveled = 0;
    state.playing = true;
    state.navigating = true;
    state.arrived = false;
    state.following = true;
    state.lastStep = -1;
    state.ri = 0;
    hideBanner();
    if (!(state.pos && state.pos.manual)) startWatch();
    altLayers.forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
    altLayers = [];
    arrowLayers.forEach(function (l) { if (map.hasLayer(l)) map.removeLayer(l); });
    arrowLayers = [];
    setSheetMode('hidden');
    hud.classList.add('on');
    navBar.classList.add('on');
    me.setOpacity(0);
    topEl.classList.add('hidden');
    setSheetHeight();
    map.setView(r.pts[0], 16, { animate: false });
    speak(nextInstructionText());
  }

  function stopNav() {
    closeOpts();
    if (typeof closeReportMenu === 'function') closeReportMenu();
    stopWatch();
    state.navigating = false;
    state.playing = false;
    clearJam();
    hud.classList.remove('on');
    navBar.classList.remove('on');
    topEl.classList.remove('hidden');
    me.setOpacity(1);
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (casingLayer) { map.removeLayer(casingLayer); casingLayer = null; }
    setSheetMode('open');
    if (state.routes.length) { drawRoutes(); renderRoutes(); fitToRoute(); }
    else renderHome();
    setSheetHeight();
    hideBanner();
  }

  function pointAt(pts, cum, d) {
    if (!pts.length) return state.pos ? [state.pos.lat, state.pos.lon] : FRANCE;
    if (d <= 0) return pts[0];
    var total = cum[cum.length - 1];
    if (d >= total) return pts[pts.length - 1];
    var lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    var seg = cum[hi] - cum[lo];
    var t = seg > 0 ? (d - cum[lo]) / seg : 0;
    return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * t, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * t];
  }
  function stepIndex(traveled) {
    var r = state.route, idx = 0;
    for (var i = 0; i < r.steps.length; i++) {
      if (r.steps[i].at <= traveled + 2) idx = i; else break;
    }
    return idx;
  }
  function nextInstructionText() {
    if (!state.route) return '';
    var s = state.route.steps[stepIndex(state.traveled)];
    return s ? s.text : '';
  }

  var HUD_ICONS = {
    straight: '<path d="M12 20V5"/><path d="M8 9l4-4 4 4"/>',
    right: '<path d="M9 20V9a3 3 0 0 1 3-3h6"/><path d="M15 3l3 3-3 3"/>',
    left: '<path d="M15 20V9a3 3 0 0 0-3-3H6"/><path d="M9 3L6 6l3 3"/>',
    round: '<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/>',
    dest: '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/>'
  };
  function hudKind(type) {
    if (type === 26 || type === 27) return 'round';
    if (type === 4 || type === 5 || type === 6) return 'dest';
    if ([2, 9, 10, 11, 18, 20, 23, 25].indexOf(type) >= 0) return 'right';
    if ([3, 14, 15, 16, 19, 21, 24].indexOf(type) >= 0) return 'left';
    return 'straight';
  }
  function laneHint(type) {
    var k = hudKind(type);
    if (k === 'round') return 'bonne sortie';
    if (k === 'right') return 'voie de droite';
    if (k === 'left') return 'voie de gauche';
    if (k === 'dest') return '';
    return 'tout droit';
  }

  function speak(text) {
    if (!state.prefs.voice || !VOICE_OK || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 1.02;
      var v = window.speechSynthesis.getVoices().filter(function (x) { return /fr/i.test(x.lang); })[0];
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function updateGuidance() {
    var r = state.route;
    if (!r) return;
    var rem = Math.max(0, r.length - state.traveled);
    var remTime = r.length > 0 ? (rem / r.length) * r.time : 0;
    document.getElementById('nav-eta').textContent = clock(Date.now() + remTime * 1000);
    document.getElementById('nav-meta').textContent = mins(remTime) + ' · ' + km(rem) +
      (state.gpsLive && state.fix && (Date.now() - state.fix.ts < 8000) ? '' : ' · simulation');

    var i = stepIndex(state.traveled);
    var s = r.steps[i] || r.steps[r.steps.length - 1];
    var next = r.steps[i + 1];
    var toGo = next ? Math.max(0, next.at - state.traveled) : rem;
    document.getElementById('hud-1').textContent = s && s.text ? s.text : 'Continuez';
    document.getElementById('hud-2').textContent = toGo > 40 ? 'dans ' + (toGo > 1000 ? km(toGo) : Math.round(toGo) + ' m') : 'maintenant';
    var lane = laneHint(s ? s.type : 8);
    var laneEl = document.getElementById('hud-lane');
    laneEl.hidden = !lane;
    laneEl.textContent = lane;
    if (s) document.getElementById('hud-ico').innerHTML = HUD_ICONS[hudKind(s.type)];

    var after = r.steps[i + 2];
    document.getElementById('hud-3').textContent = after ? 'puis ' + after.text : '';
    document.getElementById('hud-prog').style.width =
      Math.max(0, Math.min(100, (state.traveled / r.length) * 100)).toFixed(1) + '%';

    if (i !== state.lastStep) {
      state.lastStep = i;
      if (state.navigating) speak(s ? s.text : '');
    }
  }

  function setCar(p, deg) {
    if (!carMarker) {
      carMarker = L.marker(p, {
        icon: L.divIcon({
          className: '', iconSize: [34, 34], iconAnchor: [17, 17],
          html: '<div class="car"><i style="transform:rotate(' + deg + 'deg)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l7 18-7-4-7 4 7-18z"/></svg></i></div>'
        }),
        zIndexOffset: 900, interactive: false, keyboard: false
      }).addTo(map);
    } else {
      carMarker.setLatLng(p);
      var el = carMarker.getElement();
      var i = el ? el.querySelector('i') : null;
      if (i) i.style.transform = 'rotate(' + deg + 'deg)';
    }
  }

  /* la carte ne bouge que quand le véhicule s'éloigne du centre : c'est ce qui
     supprime le tremblement d'un recentrage à chaque image */
  var lastPan = 0;
  function keepCarInView(p, ts) {
    if (!state.following) return;
    var size = map.getSize();
    var pt = map.latLngToContainerPoint(p);
    var dx = pt.x - size.x / 2;
    var dy = pt.y - size.y * 0.44;
    if (Math.abs(dx) < 60 && Math.abs(dy) < 60) return;
    var now = ts || (window.performance && performance.now()) || Date.now();
    if (now - lastPan < 550) return;
    lastPan = now;
    map.panTo(p, { animate: true, duration: 0.55, easeLinearity: 0.35 });
  }

  var lastTs = 0;
  function loop(ts) {
    var live = state.gpsLive && state.fix && (Date.now() - state.fix.ts < 8000);

    if (state.playing && state.route && !live) {
      /* pas de signal GPS : le trajet avance en simulation pour rester utilisable */
      var dt = lastTs ? Math.min(.12, (ts - lastTs) / 1000) : 0;
      var avg = state.route.time > 0 ? state.route.length / state.route.time : 13.9;
      state.traveled = Math.min(state.route.length, state.traveled + avg * dt);
      if (state.traveled >= state.route.length) { state.playing = false; arrive(); }
    }
    lastTs = ts;

    if (state.route && state.navigating) {
      var p = live ? [state.fix.lat, state.fix.lon] : pointAt(state.route.pts, state.route.cum, state.traveled);
      var ref = pointAt(state.route.pts, state.route.cum, Math.min(state.route.length, state.traveled + 15));
      setCar(p, (bearing(p, ref) + currentBearing() + 360) % 360);
      keepCarInView(p, ts);
      if (state.capUp) {
        var hdg = bearing(p, ref);
        var want = -hdg;
        if (Math.abs(((want - currentBearing() + 540) % 360) - 180) > 6) setBearing(want);
      }
      updateGuidance();
      if (live && state.traveled >= state.route.length - 8) { state.playing = false; arrive(); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function arrive() {
    state.navigating = false;
    state.arrived = true;
    hud.classList.remove('on');
    navBar.classList.remove('on');
    closeOpts();
    topEl.classList.remove('hidden');
    setSheetMode('open');
    speak('Vous êtes arrivé à destination.');
    clearJam();
    var r = state.route;
    sheetBody.innerHTML =
      '<h2>Vous êtes arrivé</h2>' +
      '<p class="sub">' + escapeHtml(state.dest.name) + '</p>' +
      '<div class="facts"><span class="big" style="color:var(--go-deep)">' + km(r.length) + '</span>' +
      '<span class="sep"></span><span class="sm">' + mins(r.time) + (r.main ? ' · via ' + escapeHtml(r.main) : '') + '</span>' +
      '<span class="tag" style="color:var(--go-deep);background:#e6f8ee"><i></i>Trajet terminé</span></div>' +
      '<button class="go" id="done" style="margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg>Retour à l’accueil</button>' +
      '<button class="ghost" id="again">Refaire ce trajet</button>';
    document.getElementById('done').addEventListener('click', function () {
      if (carMarker) { map.removeLayer(carMarker); carMarker = null; }
      state.navigating = false;
      topEl.classList.remove('hidden');
      me.setOpacity(1);
      if (state.pos) map.setView([state.pos.lat, state.pos.lon], 15, { animate: false });
      renderHome();
      setSheetHeight();
    });
    document.getElementById('again').addEventListener('click', function () {
      if (carMarker) { map.removeLayer(carMarker); carMarker = null; }
      state.navigating = false;
      state.arrived = false;
      topEl.classList.remove('hidden');
      me.setOpacity(1);
      startRoutes(state.dest);
    });
    setSheetHeight();
  }

  /* ---------- détour (bouchon ou rue à éviter) ---------- */
  function clearJam() {
    if (jamLayer && map.hasLayer(jamLayer)) map.removeLayer(jamLayer);
    if (jamCasing && map.hasLayer(jamCasing)) map.removeLayer(jamCasing);
    jamLayer = jamCasing = null;
    if (jamMarker && map.hasLayer(jamMarker)) map.removeLayer(jamMarker);
    jamMarker = null;
  }

  /* tronçon bloqué : rouge sur la carte, façon embouteillage */
  function paintJam(fromD, toD) {
    clearJam();
    var seg = [];
    for (var d = fromD; d <= toD; d += 20) seg.push(pointAt(state.route.pts, state.route.cum, d));
    jamCasing = L.polyline(seg, { color: '#ffffff', weight: 14, opacity: .95, lineCap: 'round' }).addTo(map);
    jamLayer = L.polyline(seg, { color: '#e5484d', weight: 9, opacity: 1, lineCap: 'round' }).addTo(map);
  }

  function reroute(kind) {
    if (!state.route || !state.navigating) return;
    if (kind === 'gps') {
      var f = state.fix || pointAt(state.route.pts, state.route.cum, state.traveled);
      var optsG = { costing: state.prefs.costing };
      if (state.route.extra && state.route.extra.costing_options) optsG.costing_options = state.route.extra.costing_options;
      banner('Tu as quitté l’itinéraire : recalcul en cours…');
      return valhalla({ lat: f.lat, lon: f.lon }, state.dest, optsG).then(function (nr) {
        state.route = nr;
        state.traveled = 0;
        state.ri = 0;
        state.lastStep = -1;
        if (routeLayer) map.removeLayer(routeLayer);
        if (casingLayer) map.removeLayer(casingLayer);
        casingLayer = L.polyline(nr.pts, { color: '#fff', weight: 13, opacity: .95, lineCap: 'round' }).addTo(map);
        routeLayer = L.polyline(nr.pts, { color: '#2f6bff', weight: 8, lineCap: 'round' }).addTo(map);
        state.following = true;
        state.offCount = 0;
        banner('Nouvel itinéraire calculé. Arrivée à ' + clock(Date.now() + nr.time * 1000) + '.', 7000);
      }).catch(function () { banner('Recalcul impossible — vérifie la connexion.', 6000); });
    }
    var ahead = Math.min(state.route.length - 20, state.traveled + 500);
    if (ahead <= state.traveled + 30) { toast('Trop proche de l’arrivée'); return; }
    var p = pointAt(state.route.pts, state.route.cum, ahead);
    var streetName = '';
    var si = stepIndex(ahead);
    if (state.route.steps[si]) streetName = state.route.steps[si].street || '';

    paintJam(state.traveled, Math.min(state.route.length, ahead + 160));
    jamMarker = L.marker(p, {
      icon: L.divIcon({
        className: '', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="jam"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" style="width:16px;height:16px"><path d="M12 6v7M12 16.5v.4"/></svg></div>'
      })
    }).addTo(map);

    var dLat = 130 / 111320;
    var dLon = 130 / (111320 * Math.cos(p[0] * Math.PI / 180));
    var ring = [[p[1] - dLon, p[0] - dLat], [p[1] + dLon, p[0] - dLat], [p[1] + dLon, p[0] + dLat], [p[1] - dLon, p[0] + dLat], [p[1] - dLon, p[0] - dLat]];

    var from = pointAt(state.route.pts, state.route.cum, state.traveled);
    var beforeTime = state.route.length > 0
      ? ((state.route.length - state.traveled) / state.route.length) * state.route.time : 0;

    banner(kind === 'street'
      ? 'Rue évitée' + (streetName ? ' (' + streetName + ')' : '') + ' : nouvel itinéraire en cours…'
      : 'Bouchon signalé. Recherche d’un autre trajet…');

    var opts = { avoid_polygons: [ring] };
    if (state.route.extra) for (var k in state.route.extra) opts[k] = state.route.extra[k];

    valhalla({ lat: from[0], lon: from[1] }, state.dest, opts)
      .then(function (nr) {
        var diff = Math.round((nr.time - beforeTime) / 60);
        state.route = nr;
        state.traveled = 0;
        state.lastStep = -1;
        if (routeLayer) map.removeLayer(routeLayer);
        if (casingLayer) map.removeLayer(casingLayer);
        casingLayer = L.polyline(nr.pts, { color: '#fff', weight: 13, opacity: .95, lineCap: 'round' }).addTo(map);
        routeLayer = L.polyline(nr.pts, { color: '#2f6bff', weight: 8, lineCap: 'round' }).addTo(map);
        state.following = true;
        map.setView(from, 16, { animate: false });
        banner((kind === 'street' ? 'Nouvel itinéraire' : 'Bouchon évité') + ' : ' +
          (diff > 0 ? '+' + diff + ' min' : diff + ' min') + '. Arrivée à ' + clock(Date.now() + nr.time * 1000) + '.', 8000);
        speak(kind === 'street' ? 'Nouvel itinéraire.' : 'Bouchon évité. Nouvel itinéraire.');
      })
      .catch(function () { banner('Recalcul impossible — vérifie la connexion.', 7000); });
  }

  document.getElementById('stop').addEventListener('click', stopNav);

  var reportMenu = document.getElementById('report-menu');
  var reportBtn = document.getElementById('report-btn');
  function closeReportMenu() {
    reportMenu.hidden = true;
    reportBtn.setAttribute('aria-expanded', 'false');
  }
  reportBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = reportMenu.hidden;
    reportMenu.hidden = !open;
    reportBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#report-menu') && !e.target.closest('#report-btn')) closeReportMenu();
  });
  Array.prototype.forEach.call(reportMenu.querySelectorAll('[data-report]'), function (b) {
    b.addEventListener('click', function () {
      closeReportMenu();
      reroute(b.dataset.report);
    });
  });

  document.getElementById('compass').addEventListener('click', function () {
    if (state.navigating) {
      state.capUp = !state.capUp;
      if (state.capUp) {
        var p = pointAt(state.route.pts, state.route.cum, state.traveled);
        var a = pointAt(state.route.pts, state.route.cum, Math.min(state.route.length, state.traveled + 25));
        setBearing(-bearing(p, a));
        toast('Carte orientée vers la route');
      } else {
        setBearing(0);
        toast('Nord en haut');
      }
    } else {
      setBearing(0);
      toast('Nord en haut');
    }
  });

  document.getElementById('recenter').addEventListener('click', function () {
    state.following = true;
    if (state.route && state.navigating) {
      map.setView(pointAt(state.route.pts, state.route.cum, state.traveled), 16, { animate: false });
      toast('Caméra sur le véhicule');
    } else if (state.routes.length) { fitToRoute(); toast('Vue sur l’itinéraire'); }
    else { map.setView(state.pos ? [state.pos.lat, state.pos.lon] : FRANCE, state.pos ? 15 : 5, { animate: false }); }
  });

  document.getElementById('gear').addEventListener('click', openOpts);

  /* ---------- options ---------- */
  var AVOIDS = [
    { key: 'tolls', label: 'Éviter les péages', hint: 'routes à péage' },
    { key: 'highways', label: 'Éviter les autoroutes', hint: 'voies rapides' },
    { key: 'ferry', label: 'Éviter les bacs', hint: 'traversées en bateau' },
    { key: 'tracks', label: 'Éviter les chemins non goudronnés', hint: 'pistes et chemins' }
  ];

  function avoidRow(a) {
    return '<div class="row"><span class="lab">' + a.label + '<span class="hint">' + a.hint + '</span></span>' +
      '<button class="sw" type="button" data-avoid="' + a.key + '" aria-pressed="' +
      (state.prefs[a.key] ? 'true' : 'false') + '" aria-label="' + a.label + '"></button></div>';
  }
  function renderAvoids() {
    var wrap = document.getElementById('avoids');
    if (state.prefs.costing !== 'auto') {
      document.getElementById('avoids-wrap').hidden = true;
      return;
    }
    document.getElementById('avoids-wrap').hidden = false;

    /* deux réglages courants, les deux autres derrière « Plus d'options » */
    var extrasOn = state.prefs.ferry || state.prefs.tracks;
    var open = state.moreOpen || extrasOn;
    wrap.innerHTML = AVOIDS.slice(0, 2).map(avoidRow).join('') +
      '<div class="more-avoids" id="more-avoids"' + (open ? '' : ' hidden') + '>' +
      AVOIDS.slice(2).map(avoidRow).join('') + '</div>' +
      '<button class="linkbtn" id="more-btn" type="button">' +
      (open ? 'Moins d’options' : 'Plus d’options') + '</button>';

    Array.prototype.forEach.call(wrap.querySelectorAll('[data-avoid]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.avoid;
        state.prefs[k] = !state.prefs[k];
        b.setAttribute('aria-pressed', String(state.prefs[k]));
        savePrefs();
        recompute();
      });
    });
    document.getElementById('more-btn').addEventListener('click', function () {
      state.moreOpen = !open;
      renderAvoids();
    });
  }

  function setVoice(on) {
    if (on && !VOICE_OK) { toast('Pas de synthèse vocale dans ce navigateur'); return; }
    state.prefs.voice = on;
    document.getElementById('sw-voice').setAttribute('aria-pressed', String(on));
    var sw = document.getElementById('sw-voice');
    if (sw) sw.setAttribute('aria-pressed', String(on));
    if (!on && VOICE_OK) window.speechSynthesis.cancel();
    savePrefs();
  }

  function openOpts() {
    renderAvoids();
    Array.prototype.forEach.call(document.querySelectorAll('#seg-costing button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.costing === state.prefs.costing));
    });
    document.getElementById('sw-voice').setAttribute('aria-pressed', String(state.prefs.voice));
    var hint = document.getElementById('plan-hint');
    hint.textContent = state.planTs ? dayLabel(state.planTs) : 'maintenant';
    document.getElementById('plan-input').value = state.planTs ? toLocalInput(state.planTs) : '';
    ovl.classList.add('on');
  }
  function closeOpts() { ovl.classList.remove('on'); }

  function toLocalInput(ts) {
    var d = new Date(ts - d0());
    return d.toISOString().slice(0, 16);
  }
  function d0() { return new Date().getTimezoneOffset() * 60000; }

  function recompute() {
    if (state.navigating) { toast('Option enregistrée pour le prochain trajet'); return; }
    if (state.dest) startRoutes(state.dest);
    else renderHome();
  }

  document.getElementById('ovl-x').addEventListener('click', closeOpts);
  ovl.addEventListener('click', function (e) { if (e.target === ovl) closeOpts(); });
  document.addEventListener('visibilitychange', function () { lastTs = 0; });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeOpts(); hideSuggestions(); hideBanner();
      if (state.pickMode === 'from') {
        state.pickMode = 'dest';
        qInput.placeholder = 'Où va-t-on ?';
        searchBox.classList.remove('picking');
      }
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('#seg-costing button'), function (b) {
    b.addEventListener('click', function () {
      state.prefs.costing = b.dataset.costing;
      Array.prototype.forEach.call(document.querySelectorAll('#seg-costing button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
      savePrefs();
      renderAvoids();
      recompute();
    });
  });

  document.getElementById('sw-voice').addEventListener('click', function () { setVoice(!state.prefs.voice); });
  document.getElementById('voice-test').addEventListener('click', function () {
    if (!state.prefs.voice) setVoice(true);
    speak('Dans 300 mètres, tournez à droite, puis restez sur la voie de droite.');
    toast('Annonce envoyée à la voix du téléphone');
  });

  document.getElementById('plan-input').addEventListener('change', function () {
    if (!this.value) { state.planTs = null; }
    else {
      var ts = new Date(this.value).getTime();
      state.planTs = isNaN(ts) ? null : ts;
    }
    document.getElementById('plan-hint').textContent = state.planTs ? dayLabel(state.planTs) : 'maintenant';
    if (state.dest && !state.navigating) startRoutes(state.dest);
  });
  document.getElementById('plan-clear').addEventListener('click', function () {
    state.planTs = null;
    document.getElementById('plan-input').value = '';
    document.getElementById('plan-hint').textContent = 'maintenant';
    if (state.dest && !state.navigating) startRoutes(state.dest);
    else renderHome();
    toast('Départ immédiat');
  });



  document.getElementById('reset-opts').addEventListener('click', function () {
    state.prefs.costing = 'auto';
    state.prefs.tolls = state.prefs.highways = state.prefs.ferry = state.prefs.tracks = false;
    setVoice(true);
    savePrefs();
    Array.prototype.forEach.call(document.querySelectorAll('#seg-costing button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.costing === 'auto'));
    });
    renderAvoids();
    recompute();
    toast('Préférences réinitialisées');
  });

  /* poignée : glisser pour ouvrir/fermer, taper pour basculer */
  (function () {
    var grip = document.getElementById('grip');
    var drag = null;

    grip.addEventListener('pointerdown', function (e) {
      if (sheetMode === 'hidden') return;
      drag = { y: e.clientY, from: shownFor(sheetMode), moved: false };
      sheet.classList.add('dragging');
      try { grip.setPointerCapture(e.pointerId); } catch (err) {}
    });

    grip.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dy = drag.y - e.clientY;
      if (Math.abs(dy) > 5) drag.moved = true;
      applySheet(drag.from + dy, false);
    });

    function end(e) {
      if (!drag) return;
      var dy = drag.y - e.clientY;
      sheet.classList.remove('dragging');
      var h = sheetH();
      if (!drag.moved) {
        setSheetMode(sheetMode === 'open' ? 'closed' : 'open');
      } else {
        var cur = drag.from + dy;
        var targets = [54, Math.min(152, h), h];
        var best = targets.reduce(function (a, b) {
          return Math.abs(b - cur) < Math.abs(a - cur) ? b : a;
        });
        setSheetMode(best >= h - 1 ? 'open' : best > 60 ? 'peek' : 'closed');
      }
      grip.setAttribute('aria-label', sheetMode === 'open' ? 'Réduire la fiche' : 'Agrandir la fiche');
      drag = null;
    }
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', function () { drag = null; sheet.classList.remove('dragging'); });
  })();

  map.on('dragstart', function () { state.following = false; });
  map.on('click', function () { hideSuggestions(); });

  function fitPhone() {
    var phone = document.querySelector('.phone');
    if (window.innerWidth <= 560) { phone.classList.remove('noscale'); return; }
    var k = Math.min(1, (window.innerHeight - 32) / 860, (window.innerWidth - 32) / 400);
    document.documentElement.style.setProperty('--scale', k.toFixed(3));
    phone.classList.toggle('noscale', k >= 0.999);
  }
  fitPhone();
  window.addEventListener('resize', fitPhone);

  state.recents = loadRecents();
  loadPrefs();
  document.getElementById('sw-voice').setAttribute('aria-pressed', String(state.prefs.voice));
  renderHome();
  locate();
  sizeMap();
  setTimeout(function () { sizeMap(); setSheetHeight(); }, 200);
})();
</script>
</body>
</html>
