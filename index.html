<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navigation</title>
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6bff'/><path d='M16 7l6 15-6-3.5-6 3.5z' fill='%23fff'/></svg>">
<meta name="description" content="Maquette : recherche d'adresse, itinéraires comparés, véhicule, péages, voie à prendre, guidage vocal, départ planifié.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --text:#101828;--muted:#667085;--line:rgba(16,24,40,.10);--sheet:#fff;
    --blue:#2f6bff;--go:#12b76a;--go-deep:#0b7b46;--warn:#f79009;--danger:#e5484d;--chip:#f2f4f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(circle at 50% 0%,#1b202a 0%,#0b0d11 62%);
    font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
    display:grid;place-items:center;overflow:hidden;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  body,.screen{-webkit-user-select:none;user-select:none}
  .sheet-body,.hud,.sugg{-webkit-overflow-scrolling:touch}
  input{font:inherit;color:inherit;border:0;background:none;outline:none}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .phone{
    position:relative;width:400px;height:860px;flex:none;border-radius:46px;background:#000;padding:9px;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08) inset;
    overflow:hidden;transform:scale(var(--scale,1));transform-origin:center center;will-change:transform;
  }
  .phone.noscale{transform:none}
  .screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#e9e6df;
    contain:paint;clip-path:inset(0 round 38px)}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:104px;height:26px;border-radius:14px;background:#000;z-index:1200}
  .phone::after{content:"";position:absolute;inset:0;border-radius:46px;pointer-events:none;z-index:1300;box-shadow:inset 0 0 0 9px #000}
  @media (max-width:560px){
    body{background:#e9e6df;display:block}
    .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none}
    .screen{border-radius:0}
    .notch,.phone::after{display:none}
  }

  #map{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e9e6df;font-family:inherit;z-index:0}
  .leaflet-container{background:#e9e6df;font-family:inherit}
  .leaflet-tile-pane{filter:saturate(1.06) brightness(1.02) contrast(1.05)}
  .leaflet-bottom.leaflet-left{bottom:calc(var(--credit,240px) + 2px);transition:bottom .3s cubic-bezier(.22,.68,.24,1)}
  .leaflet-control-attribution{font-size:9.5px!important;background:rgba(255,255,255,.84)!important;color:#8a8f9c!important;padding:2px 7px!important;border-radius:3px!important;margin:0!important}
  .leaflet-control-attribution a{color:#8a8f9c!important;text-decoration:none}
  .leaflet-control-scale-line{
    background:rgba(255,255,255,.85)!important;border-color:#b9bec9!important;color:#5d6470!important;
    font-size:9.5px!important;line-height:1.2!important;padding:1px 5px!important;border-radius:2px;
  }

  .me-dot{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;position:relative;box-shadow:0 0 0 1px rgba(47,107,255,.35),0 3px 8px rgba(11,18,32,.35)}
  .me-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:rgba(47,107,255,.22);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.55);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
  .pin-dest{position:relative;width:36px;height:48px}
  .pin-dest .lbl{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);white-space:nowrap;background:#fff;
    color:var(--text);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;
    box-shadow:0 6px 16px -6px rgba(11,18,32,.45),0 0 0 1px rgba(16,24,40,.06)}
  .car{width:34px;height:34px;display:grid;place-items:center}
  .car i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue);border:3px solid #fff;
    box-shadow:0 6px 16px -4px rgba(47,107,255,.75)}
  .car svg{width:16px;height:16px;color:#fff}
  .rarrow{width:13px;height:13px;display:grid;place-items:center;filter:drop-shadow(0 1px 1.5px rgba(11,18,32,.5))}
  .rarrow svg{width:13px;height:13px;display:block}
  .jam{width:30px;height:30px;border-radius:50%;background:var(--danger);border:2.5px solid #fff;display:grid;place-items:center;box-shadow:0 5px 12px -4px rgba(11,18,32,.5)}

  .top{position:absolute;top:calc(18px + env(safe-area-inset-top));left:14px;right:14px;z-index:900;
    transition:opacity .25s ease,transform .25s ease}
  .top.hidden{opacity:0;transform:translateY(-16px);pointer-events:none}
  .search{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 15px;background:#fff;border-radius:15px;
    box-shadow:0 12px 30px -12px rgba(11,18,32,.42),0 0 0 1px rgba(16,24,40,.05)}
  .search>svg{width:19px;height:19px;color:var(--muted);flex:none}
  .search input{flex:1;min-width:0;font-size:15px}
  .search input::placeholder{color:var(--muted)}
  .search input:focus,.search input:focus-visible{outline:none}
  .search:focus-within{box-shadow:0 12px 30px -12px rgba(11,18,32,.42),0 0 0 2px rgba(47,107,255,.35)}
  .search.picking{box-shadow:0 12px 30px -12px rgba(11,18,32,.42),0 0 0 2px rgba(247,144,9,.55)}
  .search .x{width:30px;height:30px;border-radius:50%;background:var(--chip);display:none;place-items:center;color:#475467;flex:none}
  .search .gear{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#344054;flex:none;background:var(--chip)}
  .search .gear svg{width:18px;height:18px}
  .search .gear:hover{background:#e6e9ee}
  .search.filled .x{display:grid}
  .sugg{margin-top:8px;background:#fff;border-radius:14px;overflow-y:auto;box-shadow:0 20px 40px -18px rgba(11,18,32,.45);max-height:300px}
  .sugg[hidden]{display:none}
  .sugg button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
  .sugg button:last-child{border-bottom:0}
  .sugg button:hover{background:#f7f8fa}
  .sugg .ico{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
  .sugg .ico svg{width:14px;height:14px;color:#475467}
  .sugg .t{display:block;font-size:14px;font-weight:500;line-height:1.3}
  .sugg .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .sugg .empty{padding:14px;font-size:13px;color:var(--muted)}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:950;background:var(--sheet);border-radius:24px 24px 0 0;
    box-shadow:0 -18px 40px -22px rgba(11,18,32,.5);padding:6px 18px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(0);transition:transform .32s cubic-bezier(.22,.68,.24,1);max-height:78%;display:flex;flex-direction:column;
    will-change:transform}
  .sheet.dragging{transition:none!important}
  .grip{display:block;margin:0 auto 6px;padding:9px 46px 7px;border:0;background:none;cursor:grab;flex:none;touch-action:none}
  .grip:active{cursor:grabbing}
  .grip span{display:block;width:40px;height:4px;border-radius:2px;background:#dfe3ea;transition:background .2s}
  .grip:hover span{background:#c7ccd6}
  .sum{display:none;align-items:center;gap:10px;margin:6px 0 2px}
  .sum .s-dur{font-size:18px;font-weight:700}
  .sum .s-meta{font-size:11.5px;color:var(--muted);margin-left:6px}
  .sum .go{width:auto;height:42px;margin:0 0 0 auto;padding:0 16px;font-size:14px;border-radius:12px}
  .sheet.compact .sum{display:flex}
  .sheet.compact .details,.sheet.compact .sub,.sheet.compact .chipbtn,.sheet.compact .planline{display:none}
  .sheet.compact{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .sheet.closed-lede .sheet-body{pointer-events:none;opacity:0}
  .sheet.closed-lede h2,.sheet.closed-lede .sum,.sheet.closed-lede .chipbtn{display:none}
  .sheet.compact h2{margin-bottom:0}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet h2{font-size:18px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
  .sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 4px}

  .chipbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:#eef2f6;
    font-size:11.5px;font-weight:500;color:#344054;margin:7px 0 2px}
  .chipbtn svg{width:13px;height:13px}
  .planline{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#8a4b00;background:#fff5e8;
    border-radius:999px;padding:4px 10px;margin-top:7px}

  .favs{display:grid;gap:2px;margin-top:8px}
  .fav{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .fav-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
  .fav-del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#98a2b3;flex:none}
  .fav-del:hover{background:var(--chip);color:#475467}
  .linkbtn{display:block;margin:10px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .more-avoids[hidden]{display:none}
  .more-avoids{padding-top:2px}
  .fav:last-child{border-bottom:0}
  .fav .ico{width:34px;height:34px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
  .fav .ico svg{width:17px;height:17px;color:#344054}
  .fav .t{display:block;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav .s{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .fav .chev{margin-left:auto;color:#c3c8d2;display:grid;place-items:center}

  .rlist{display:grid;gap:9px;margin-top:9px}
  .rcard{border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left;width:100%;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;
    transition:border-color .18s ease,background .18s ease}
  .rcard.sel{border-color:var(--blue);background:#f5f8ff}
  .rcard .line{display:flex;align-items:baseline;gap:8px}
  .rcard .dur{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .rcard .dur.best{color:var(--go-deep)}
  .rcard .meta{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rcard .line{min-width:0}
  .rcard .tag{font-size:10.5px;font-weight:600;color:#344054;background:var(--chip);border-radius:99px;padding:3px 8px;display:inline-block;margin-top:5px}
  .rcard .tag.best{color:var(--go-deep);background:#e6f8ee}
  .rcard .eta{font-size:11px;color:var(--muted);text-align:right}
  .rcard .eta b{display:block;font-size:13.5px;color:var(--text)}
  .note1{font-size:11.5px;line-height:1.45;color:var(--muted);margin:9px 0 0}
  .facts{display:flex;align-items:baseline;gap:10px;margin:12px 0 0;flex-wrap:wrap}
  .facts .big{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .facts .sep{width:1px;height:15px;background:var(--line);align-self:center}
  .facts .sm{font-size:12.5px;color:var(--muted)}
  .facts .tag{font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
  .facts .tag i{width:6px;height:6px;border-radius:50%;background:var(--go);display:block}
  .go{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:50px;margin-top:12px;border-radius:14px;
    background:linear-gradient(180deg,#19c476,#0fa25f);color:#fff;font-size:15.5px;font-weight:600;
    box-shadow:0 12px 24px -12px rgba(15,162,95,.9)}
  .go:active{transform:translateY(1px)}
  .go svg{width:17px;height:17px}
  .ghost{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:40px;margin-top:10px;border-radius:12px;background:var(--chip);font-size:13px;font-weight:500;color:#344054}
  .loading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:16px 0}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid #d0d5dd;border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .fab-col{position:absolute;right:14px;bottom:calc(var(--sheet-h,220px) + 14px);z-index:880;display:flex;flex-direction:column;gap:10px;
    transition:bottom .3s cubic-bezier(.22,.68,.24,1)}
  .fab{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--text);
    box-shadow:0 10px 24px -10px rgba(11,18,32,.45),0 0 0 1px rgba(16,24,40,.05)}
  .fab svg{width:20px;height:20px}
  .fab.off{color:#c3c8d2}

  .hud{position:absolute;top:18px;left:14px;right:14px;z-index:940;background:rgba(11,18,32,.94);color:#fff;border-radius:18px;
    padding:12px 15px;display:flex;gap:13px;align-items:center;box-shadow:0 18px 36px -18px rgba(0,0,0,.7);
    transform:translateY(-140%);opacity:0;visibility:hidden;transition:transform .3s cubic-bezier(.22,.68,.24,1),opacity .26s ease,visibility .26s}
  .hud.on{transform:translateY(0);opacity:1;visibility:visible}
  .hud .arrow{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
  .hud .arrow svg{width:24px;height:24px}
  .hud .t1{font-size:14px;font-weight:600;line-height:1.3;margin:0}
  .hud .t2{font-size:11.5px;color:rgba(255,255,255,.62);margin:3px 0 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hud .lane{background:rgba(255,255,255,.14);border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:600;color:#fff}
  .hud .t3{font-size:10.5px;color:rgba(255,255,255,.45);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-bar{position:absolute;left:15px;right:15px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
  .hud-bar i{display:block;height:100%;width:0;background:#4ade80;border-radius:2px;transition:width .5s linear}

  .navbar{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:950;background:#fff;
    border-radius:18px;padding:11px 13px;display:flex;align-items:center;gap:9px;
    box-shadow:0 20px 40px -20px rgba(11,18,32,.6),0 0 0 1px rgba(16,24,40,.05);
    transform:translateY(180%);opacity:0;visibility:hidden;transition:transform .32s cubic-bezier(.22,.68,.24,1),opacity .26s ease,visibility .26s}
  .navbar.on{transform:translateY(0);opacity:1;visibility:visible}
  .navbar .eta{font-size:17px;font-weight:700}
  .navbar .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .navbar .grow{flex:1}
  .navbar .ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:#344054;flex:none}
  .navbar .ic svg{width:18px;height:18px}
  .navbar .stop{width:40px;height:40px;border-radius:12px;background:#feecec;color:var(--danger);display:grid;place-items:center;flex:none}
  .navbar .stop svg{width:17px;height:17px}
  .report-menu{
    position:absolute;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:955;
    background:#fff;border-radius:16px;padding:6px;width:236px;
    box-shadow:0 22px 44px -20px rgba(11,18,32,.55),0 0 0 1px rgba(16,24,40,.06);
  }
  .report-menu[hidden]{display:none}
  .report-menu button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 11px;border-radius:11px}
  .report-menu button:hover{background:var(--chip)}
  .report-menu svg{width:17px;height:17px;color:#475467;flex:none}
  .report-menu b{display:block;font-size:13.5px;font-weight:600}
  .report-menu i{display:block;font-size:11px;color:var(--muted);font-style:normal}


  .banner{position:absolute;top:96px;left:14px;right:14px;z-index:945;background:#fff5e8;border:1px solid #ffd9a8;color:#8a4b00;
    border-radius:13px;padding:10px 13px;font-size:12.5px;line-height:1.4;display:flex;gap:9px;align-items:flex-start;
    box-shadow:0 14px 30px -18px rgba(138,75,0,.5);transform:translateY(-14px);opacity:0;visibility:hidden;transition:all .28s ease}
  .banner.on{transform:translateY(0);opacity:1;visibility:visible}
  .banner svg{width:16px;height:16px;flex:none;margin-top:1px}

  .toast{position:absolute;left:50%;bottom:max(calc(var(--sheet-h,220px) + 22px), 100px);transform:translate(-50%,10px);z-index:980;
    background:rgba(11,18,32,.92);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:11px;opacity:0;visibility:hidden;
    transition:all .25s ease;white-space:nowrap;max-width:92%}
  .toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

  /* options */
  .ovl{position:absolute;inset:0;z-index:1100;background:rgba(11,18,32,.42);display:flex;align-items:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s}
  .ovl.on{opacity:1;visibility:visible}
  .ovl-card{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;
    padding:12px 18px calc(16px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .26s ease}
  .ovl.on .ovl-card{transform:translateY(0)}
  .ovl-head{display:flex;align-items:center;justify-content:space-between}
  .ovl-head h3{font-size:16px;font-weight:600;margin:0}
  .ovl .x{width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:#475467}
  .sec-title{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;font-weight:600}
  .seg{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-top:6px}
  .seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:500;color:#475467;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(16,24,40,.12)}
  .row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .lab{flex:1;font-size:14px;line-height:1.3}
  .row .hint{display:block;font-size:11px;color:var(--muted);margin-top:1px;font-weight:400}
  .sw{width:44px;height:26px;border-radius:99px;background:#d0d5dd;position:relative;transition:background .2s;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw[aria-pressed="true"]{background:var(--blue)}
  .sw[aria-pressed="true"]::after{transform:translateX(18px)}
  .plain{height:34px;padding:0 12px;border-radius:9px;background:var(--chip);font-size:12.5px;font-weight:500;color:#344054;flex:none}
  .plain:disabled{opacity:.45}
  .planinput{height:34px;padding:0 10px;border-radius:9px;background:var(--chip);font-size:12.5px;max-width:170px}

  @media (prefers-reduced-motion:reduce){*{animation:none;transition:none}}
</style>
</head>
<body>

<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div id="map" role="application" aria-label="Carte et itinéraire"></div>
